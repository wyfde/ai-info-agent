name: AI-INFO Evening

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-info-evening
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      AI_JOB_INTEL_LLM_API_KEY: ${{ secrets.AI_JOB_INTEL_LLM_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project
        run: python -m pip install -e .

      - name: Generate evening digest
        run: python -m ai_job_intel --config config/config.cloud.json run-evening

      - name: Save digest in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_state/*.md
          if git diff --cached --quiet; then
            echo "No digest changes"
          else
            git commit -m "Update AI digest $(date -u +%Y-%m-%d)"
            git push
          fi
