name: AI-INFO Morning

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      coverage_date:
        description: "要投递的日报日期，格式 YYYY-MM-DD；留空则投递前一晚报"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-info-morning
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project
        run: python -m pip install -e .

      - name: Check Bitable
        run: python -m ai_job_intel --config config/config.cloud.json check-bitable

      - name: Deliver latest previous digest
        shell: bash
        run: |
          if [ -n "${{ inputs.coverage_date }}" ]; then
            python -m ai_job_intel --config config/config.cloud.json send --date "${{ inputs.coverage_date }}"
          else
            python -m ai_job_intel --config config/config.cloud.json run-morning
          fi
