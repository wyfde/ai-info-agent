[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-intel-agent"
version = "0.1.0"
description = "Collect and summarize AI industry updates for AI job seekers."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-job-intel = "ai_job_intel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
